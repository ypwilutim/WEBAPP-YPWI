<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Dashboard Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-4xl mx-auto p-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-8">Minimal Dashboard Test</h1>

        <div id="locationInfo" class="mb-4 p-4 bg-blue-50 border border-blue-200 rounded-lg">
            Loading...
        </div>

        <button id="testBtn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
            Test GPS
        </button>
    </div>

    <script type="module">
        console.log('Minimal dashboard loaded');

        let currentLocation = null;

        function updateLocationDisplay(success, message) {
            const locationInfo = document.getElementById('locationInfo');
            locationInfo.className = success ?
                'mb-4 p-4 bg-green-50 border border-green-200 rounded-lg text-green-800' :
                'mb-4 p-4 bg-red-50 border border-red-200 rounded-lg text-red-800';
            locationInfo.textContent = message;
        }

        function requestLocationPermission() {
            console.log('Requesting location permission...');

            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async function(position) {
                        console.log('GPS position received');
                        currentLocation = {
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            accuracy: position.coords.accuracy
                        };
                        updateLocationDisplay(true, `Lokasi didapatkan (${Math.round(position.coords.accuracy)}m akurasi)`);

                        // Test await functionality
                        console.log('Testing await...');
                        await new Promise(resolve => setTimeout(resolve, 100));
                        console.log('Await works!');
                    },
                    function(error) {
                        console.error('GPS error:', error);
                        updateLocationDisplay(false, `GPS Error: ${error.message}`);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 30000
                    }
                );
            } else {
                updateLocationDisplay(false, 'Geolokasi tidak didukung');
            }
        }

        // Test button
        document.getElementById('testBtn').addEventListener('click', requestLocationPermission);

        // Initial message
        updateLocationDisplay(false, 'Klik tombol "Test GPS" untuk test lokasi');
        console.log('Minimal dashboard initialized');
    </script>
</body>
</html>
