<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lengkapi Profil - YPWI Absensi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen py-8 profile-page">
  <div class="pt-28 pb-12">
    <div class="max-w-7xl mx-auto px-6">
      <div class="glass rounded-3xl shadow-2xl p-10 border border-gray-100">
        <div class="text-center mb-10 float-animation">
          <div class="w-16 h-16 mx-auto mb-4 rounded-2xl gradient-bg flex items-center justify-center shadow-lg">
            <i class="bi bi-person-circle text-white text-3xl"></i>
          </div>
          <h1 class="text-4xl font-extrabold text-gray-950">Lengkapi Profil Guru</h1>
          <p class="text-gray-600 mt-2 text-lg">Lengkapi data pribadi Anda untuk akses sistem dan administrasi.</p>
        </div>

        <form id="profileForm">
          <input type="hidden" id="teacherId" name="teacherId">
          <input type="hidden" id="link_foto" name="link_foto">
          <input type="hidden" id="assignments_json" name="assignments" required>

          <div class="grid md:grid-cols-2 gap-10">
            <!-- Kolom Kiri: Data Identitas Pribadi -->
            <div class="space-y-6">
              <h3 class="text-xl font-bold text-gray-900 flex items-center gap-2 border-b pb-3">
                <i class="bi bi-person-badge text-primary"></i> Data Identitas Pribadi
              </h3>

              <div>
                <label for="nama" class="block text-sm font-semibold text-gray-700 mb-2">Nama Lengkap <span class="text-red-500">*</span></label>
                <input type="text" id="nama" name="nama" required class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition font-medium">
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label for="nip" class="block text-sm font-semibold text-gray-700 mb-2">NIY</label>
                  <input type="text" id="nip" name="nip" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium" placeholder="NIY">
                </div>
                <div>
                  <label for="nik" class="block text-sm font-semibold text-gray-700 mb-2">NIK <span class="text-red-500">*</span></label>
                  <input type="text" id="nik" name="nik" required class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium" placeholder="NIK">
                </div>
              </div>

              <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email Aktif <span class="text-red-500">*</span></label>
                <input type="email" id="email" name="email" required class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition font-medium">
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label for="tempat_lahir" class="block text-sm font-semibold text-gray-700 mb-2">Tempat Lahir <span class="text-red-500">*</span></label>
                  <input type="text" id="tempat_lahir" name="tempat_lahir" required class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium">
                </div>
                <div>
                  <label for="tanggal_lahir" class="block text-sm font-semibold text-gray-700 mb-2">Tanggal Lahir <span class="text-red-500">*</span></label>
                  <input type="date" id="tanggal_lahir" name="tanggal_lahir" required class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium">
                </div>
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label for="jenis_kelamin" class="block text-sm font-semibold text-gray-700 mb-2">Jenis Kelamin <span class="text-red-500">*</span></label>
                  <select id="jenis_kelamin" name="jenis_kelamin" required class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium">
                    <option value="">Pilih</option>
                    <option value="L">Laki-laki</option>
                    <option value="P">Perempuan</option>
                  </select>
                </div>
                <div>
                  <label for="no_wa" class="block text-sm font-semibold text-gray-700 mb-2">No. WhatsApp <span class="text-red-500">*</span></label>
                  <input type="tel" id="no_wa" name="no_wa" placeholder="08xxxxxxxx" required class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium">
                </div>
              </div>

              <div>
                <label for="alamat" class="block text-sm font-semibold text-gray-700 mb-2">Alamat Lengkap <span class="text-red-500">*</span></label>
                <textarea id="alamat" name="alamat" rows="3" required class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none transition text-gray-700 resize-none" placeholder="Masukkan alamat lengkap..."></textarea>
              </div>

            </div>

            <!-- Kolom Kanan: Kepegawaian -->
            <div class="space-y-6">
              <h3 class="text-xl font-bold text-gray-900 flex items-center gap-2 border-b pb-3">
                <i class="bi bi-briefcase text-primary"></i> Data Kepegawaian
              </h3>

              <div>
                <label for="status_kepegawaian" class="block text-sm font-semibold text-gray-700 mb-2">Status Pegawai <span class="text-red-500">*</span></label>
                  <select id="status_kepegawaian" name="status_kepegawaian" required class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium">
                    <option value="">Pilih Status</option>
                    <option value="PTY">PTY</option>
                    <option value="PKY">PKY</option>
                    <option value="Honor">Honor</option>
                  </select>
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label for="status_aktif" class="block text-sm font-semibold text-gray-700 mb-2">Status Aktif <span class="text-red-500">*</span></label>
                  <select id="status_aktif" name="status_aktif" required class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium">
                    <option value="1">Aktif</option>
                    <option value="0">Tidak Aktif</option>
                  </select>
                </div>
                <div>
                  <label for="tmt" class="block text-sm font-semibold text-gray-700 mb-2">TMT (Tanggal Masuk) <span class="text-red-500">*</span></label>
                  <input type="date" id="tmt" name="tmt" required class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium">
                </div>
              </div>



              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Penempatan di Unit Sekolah <span class="text-red-500">*</span></label>
                <button type="button" onclick="addAssignment()" class="w-full py-3 px-4 bg-primary/10 text-primary border-2 border-dashed border-primary/30 rounded-xl font-bold hover:bg-primary/20 transition flex items-center justify-center gap-2">
                  <i class="bi bi-plus-circle"></i> Tambah Penempatan Unit
                </button>
                <div id="assignments-container" class="mt-4 overflow-hidden border border-gray-200 rounded-xl shadow-inner">
                  <table class="w-full text-sm">
                    <thead class="bg-gray-100 text-gray-700 border-b">
                      <tr>
                        <th class="px-4 py-3 text-left">Unit Sekolah</th>
                        <th class="px-4 py-3 text-left">Jabatan</th>
                        <th class="px-4 py-3 text-center">Aksi</th>
                      </tr>
                    </thead>
                    <tbody id="assignments-table-body" class="bg-white divide-y divide-gray-100"></tbody>
                  </table>
                </div>
              </div>

              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Upload Pas Foto</label>
                <div class="flex items-center gap-4 bg-gray-50 border border-gray-200 p-4 rounded-2xl">
                  <div class="border-2 border-dashed border-gray-300 rounded-xl p-3 text-center flex-1 hover:border-primary transition cursor-pointer" onclick="document.getElementById('foto').click()">
                    <input type="file" class="hidden" id="foto" name="foto" accept="image/*" onchange="previewPhoto(this)">
                    <i class="bi bi-camera-fill text-primary text-3xl mb-2"></i>
                    <p class="text-gray-700 font-medium text-sm mb-1">Klik untuk upload foto</p>
                  </div>
                  <div class="w-20 h-20 rounded-2xl border-2 border-gray-200 overflow-hidden bg-white flex-shrink-0 flex items-center justify-center relative">
                    <img id="photo-preview" class="w-full h-full object-cover hidden">
                    <i class="bi bi-person text-gray-400 text-3xl absolute" id="photo-icon"></i>
                  </div>
                </div>
                <div id="existing-photo-info" class="mt-2">
                  <small class="text-green-600">
                    <i class="bi bi-check-circle-fill mr-1"></i>
                    Foto sudah tersimpan di database
                  </small>
                </div>
              </div>
            </div>
          </div>

          <div class="pt-10 border-t border-gray-100">
            <button type="submit" class="w-full max-w-lg mx-auto bg-[#066e3a] text-white font-extrabold py-4 px-8 rounded-3xl text-xl flex items-center justify-center gap-3 shadow-lg transform hover:scale-[1.02] transition">
              <i class="bi bi-cloud-arrow-up-fill"></i>
              SIMPAN DATA PROFIL
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal Penempatan -->
  <div id="modal-penempatan" class="hidden fixed inset-0 z-[999] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
    <div class="bg-white rounded-2xl p-8 w-full max-w-md shadow-2xl scale-95 transition-all duration-300">
      <h3 class="text-xl font-bold text-gray-950 mb-6 flex items-center gap-2">
        <i class="bi bi-building-add text-primary"></i> Tambah Penempatan Unit
      </h3>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Unit Sekolah</label>
          <select id="assignmentUnit" required class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-primary outline-none font-medium">
            <option value="">Pilih Unit Sekolah</option>
            <!-- Options populated by JavaScript -->
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Jabatan</label>
          <select id="assignmentJabatan" required class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-primary outline-none font-medium">
            <option value="">Pilih Jabatan</option>
            <option value="Pimpinan">Pimpinan</option>
            <option value="Admin">Admin</option>
            <option value="Operator">Operator</option>
            <option value="Tata Usaha (TU)">Tata Usaha (TU)</option>
            <option value="Bendahara">Bendahara</option>
            <option value="Walikelas">Walikelas</option>
            <option value="Guru Mapel">Guru Mapel</option>
            <option value="Security">Security</option>
            <option value="Driver">Driver</option>
            <option value="Cleaning Service">Cleaning Service</option>
          </select>
        </div>
      </div>

      <div class="flex items-center justify-end gap-3 mt-8">
        <button type="button" onclick="closeAssignmentModal()" class="px-5 py-2.5 bg-gray-100 text-gray-700 rounded-xl font-bold hover:bg-gray-200 transition">Batal</button>
        <button type="button" onclick="saveAssignment()" class="px-5 py-2.5 bg-[#066e3a] text-white rounded-xl font-bold hover:bg-[#066e3a]/90 transition flex items-center gap-1.5">
          <i class="bi bi-check-circle"></i> Tambahkan
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    // Authentication bypassed - allow access without login

    // Get teacher ID from URL parameter or sessionStorage
    const urlParams = new URLSearchParams(window.location.search);
    const teacherId = urlParams.get('teacher_id') || sessionStorage.getItem('teacherId');

    if (!teacherId) {
      Swal.fire({ title: 'Akses Tidak Sah', text: 'ID Guru tidak ditemukan.', icon: 'error', confirmButtonColor: '#667eea' }).then(() => {
        if (user.role === 'admin') {
          window.location.href = 'admin-dashboard.html';
        } else {
          window.location.href = 'login.html';
        }
      });
      throw new Error('No teacher ID');
    }

    document.getElementById('teacherId').value = teacherId;

    // Fetch teacher data
    fetchTeacherData();
    fetchTenants();

    async function fetchTeacherData() {
      try {
        const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
        const response = await fetch(`/api/admin/teachers/${teacherId}`, { headers });

        if (response.ok) {
          const res = await response.json();
          if (res.success && res.data) {
            const teacher = res.data;
            populateForm(teacher);
            displayAssignments(teacher.assignments || []);
          }
        }
      } catch (error) {
        console.error('Error fetching teacher data:', error);
      }
    }

    async function fetchTenants() {
      try {
        const response = await fetch('/api/admin/tenants');
        if (response.ok) {
          const res = await response.json();
          if (res.success) {
            populateTenantSelect(res.data);
          }
        }
      } catch (error) {
        console.error('Error fetching tenants:', error);
      }
    }

    function populateTenantSelect(tenants) {
      const select = document.getElementById('assignmentUnit');
      select.innerHTML = '<option value="">Pilih Unit Sekolah</option>';
      tenants.forEach(tenant => {
        const option = document.createElement('option');
        option.value = tenant.tenant_id;
        option.textContent = `${tenant.nama_sekolah} (${tenant.tenant_id})`;
        select.appendChild(option);
      });
    }

    function populateForm(teacher) {
      const setValue = (id, value) => {
        const el = document.getElementById(id);
        if (el) el.value = value || '';
      };



      setValue('nama', teacher.nama);
      setValue('nik', teacher.nik);
      setValue('tempat_lahir', teacher.tempat_lahir);
      setValue('tanggal_lahir', teacher.tanggal_lahir);
      setValue('jenis_kelamin', teacher.jenis_kelamin);
      setValue('alamat', teacher.alamat);
      setValue('email', teacher.email);
      setValue('no_wa', teacher.no_wa);
      setValue('nip', teacher.nip);
      setValue('status_kepegawaian', teacher.status_kepegawaian);
      setValue('tmt', teacher.tmt);
      setValue('status_aktif', teacher.status_aktif);

      if (teacher.link_foto) {
        document.getElementById('photo-preview').src = teacher.link_foto;
        document.getElementById('photo-preview').classList.remove('hidden');
        document.getElementById('photo-icon').classList.add('hidden');
      }
    }

    function displayAssignments(assignments) {
      const tbody = document.getElementById('assignments-table-body');
      tbody.innerHTML = assignments.map(assignment => `
        <tr>
          <td class="px-4 py-3">${assignment.tenant_id}</td>
          <td class="px-4 py-3">${assignment.jabatan_di_unit}</td>
          <td class="px-4 py-3 text-center">
            <button onclick="deleteAssignment('${assignment.tenant_id}', '${assignment.jabatan_di_unit}')" class="text-red-600 hover:text-red-800">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    const form = document.getElementById('profileForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<div class="inline-block animate-spin rounded-full h-5 w-5 border-4 border-white border-t-transparent mr-2"></div>Menyimpan...';

      try {
        const formData = new FormData(form);
        const data = Object.fromEntries(formData);



        const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
        const response = await fetch(`/api/admin/teachers/${data.teacherId}`, {
          method: 'PUT',
          headers: { ...headers, 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          Swal.fire({
            title: 'Berhasil!',
            text: 'Profil berhasil diperbarui!',
            icon: 'success',
            timer: 2000,
            timerProgressBar: true,
            showConfirmButton: false
          }).then(() => {
            window.location.href = 'login.html';
          });
        } else {
          throw new Error('Update failed');
        }
      } catch (error) {
        Swal.fire({ title: 'Gagal', text: 'Terjadi kesalahan. Silakan coba lagi.', icon: 'error', confirmButtonText: 'OK' });
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-cloud-arrow-up-fill"></i> SIMPAN DATA PROFIL';
      }
    });

    form.querySelectorAll('input[required]').forEach(input => {
      input.addEventListener('blur', () => {
        if (!input.value.trim()) {
          input.style.borderColor = '#ef4444';
        } else {
          input.style.borderColor = '#d1d5db';
        }
      });
      input.addEventListener('input', () => {
        input.style.borderColor = '#667eea';
      });
    });

    // Assignment functions
    function addAssignment() {
      document.getElementById('modal-penempatan').classList.remove('hidden');
      document.getElementById('modal-penempatan').classList.add('flex');
    }

    function closeAssignmentModal() {
      document.getElementById('modal-penempatan').classList.add('hidden');
      document.getElementById('modal-penempatan').classList.remove('flex');
      document.getElementById('assignmentUnit').value = '';
      document.getElementById('assignmentJabatan').value = '';
    }

    async function saveAssignment() {
      const tenantId = document.getElementById('assignmentUnit').value;
      const jabatan = document.getElementById('assignmentJabatan').value;

      if (!tenantId || !jabatan) {
        alert('Pilih Unit Sekolah dan Jabatan');
        return;
      }
      try {
        const headers = token ? { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
        const response = await fetch(`/api/admin/teachers/${teacherId}/assignments`, {
          method: 'POST',
          headers,
          body: JSON.stringify({ tenant_id: tenantId, jabatan_di_unit: jabatan })
        });

        if (response.ok) {
          closeAssignmentModal();
          fetchTeacherData(); // Refresh data
        } else {
          alert('Gagal menambah penugasan');
        }
      } catch (error) {
        console.error('Error adding assignment:', error);
      }
    }

    async function deleteAssignment(tenantId, jabatan) {
      if (!confirm('Hapus penugasan ini?')) return;

      try {
        const headers = token ? { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
        const response = await fetch(`/api/admin/teachers/${teacherId}/assignments`, {
          method: 'DELETE',
          headers,
          body: JSON.stringify({ tenant_id: tenantId, jabatan_di_unit: jabatan })
        });

        if (response.ok) {
          fetchTeacherData(); // Refresh data
        } else {
          alert('Gagal menghapus penugasan');
        }
      } catch (error) {
        console.error('Error deleting assignment:', error);
      }
    }

    // Photo preview
    function previewPhoto(input) {
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('photo-preview').src = e.target.result;
          document.getElementById('photo-preview').classList.remove('hidden');
          document.getElementById('photo-icon').classList.add('hidden');
        };
        reader.readAsDataURL(file);
      }
    }
  </script>
</body>
</html>
