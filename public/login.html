<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - YPWI Lutim</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen py-8 profile-page">
  <div class="pt-28 pb-12">
    <div class="max-w-7xl mx-auto px-6">
      <div class="glass rounded-3xl shadow-2xl p-10 border border-gray-100">
        <div class="text-center mb-10 float-animation">
          <div class="w-16 h-16 mx-auto mb-4 rounded-2xl gradient-bg flex items-center justify-center shadow-lg">
            <i class="bi bi-person-circle text-white text-3xl"></i>
          </div>
          <h1 class="text-4xl font-extrabold text-gray-950">Masuk ke Akun</h1>
          <p class="text-gray-600 mt-2 text-lg">Sistem Digital YPWI Lutim</p>
          <p class="text-sm text-gray-500 mt-1" id="tenantText">Memuat...</p>
        </div>

        <div class="max-w-md mx-auto">
          <form id="loginForm" method="POST" novalidate>
            <div class="mb-5">
              <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <i class="fas fa-user text-gray-400"></i>
                </div>
                <input type="text" id="username" name="username" class="w-full pl-10 pr-4 py-3 rounded-xl border-2 border-gray-200 bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition font-medium" placeholder="Masukkan username" required autocomplete="username">
              </div>
              <p class="text-red-500 text-sm mt-1 hidden" id="usernameError">Username harus diisi</p>
            </div>
            <div class="mb-6">
              <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <i class="fas fa-lock text-gray-400"></i>
                </div>
                <input type="password" id="password" name="password" class="w-full pl-10 pr-12 py-3 rounded-xl border-2 border-gray-200 bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition font-medium" placeholder="Masukkan password" required autocomplete="current-password">
                <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition">
                  <i class="fas fa-eye" id="eyeIcon"></i>
                  <i class="fas fa-eye-slash hidden" id="eyeSlashIcon"></i>
                </button>
              </div>
              <p class="text-red-500 text-sm mt-1 hidden" id="passwordError">Password harus diisi</p>
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-[#066e3a] text-white font-extrabold py-4 px-8 rounded-3xl text-xl flex items-center justify-center gap-3 shadow-lg transform hover:scale-[1.02] transition">
              <i class="bi bi-box-arrow-in-right"></i>
              Masuk
            </button>
            <div id="loadingSpinner" class="hidden text-center py-4">
              <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-primary border-t-transparent mb-2"></div>
              <p class="text-gray-600 text-sm">Sedang masuk...</p>
            </div>
          </form>
          <div class="mt-6 text-center">
            <a href="#" class="text-[#066e3a] hover:text-[#066e3a]/80 text-sm transition">Lupa password?</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="text-center mt-8 text-gray-500 text-sm">
    <p>© 2026 YPWI Lutim. Semua hak dilindungi.</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Password toggle functionality
      const togglePassword = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      const eyeSlashIcon = document.getElementById('eyeSlashIcon');

      if (togglePassword && passwordInput && eyeIcon && eyeSlashIcon) {
        togglePassword.addEventListener('click', () => {
          const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordInput.setAttribute('type', type);
          eyeIcon.classList.toggle('hidden');
          eyeSlashIcon.classList.toggle('hidden');
        });
      }

      // Tenant detection
      const hostname = window.location.hostname;
      let tenant = 'SDIT';
      if (hostname.includes('sdit')) tenant = 'SDIT';
      else if (hostname.includes('smpit')) tenant = 'SMPIT';
      else if (hostname.includes('smait')) tenant = 'SMAIT';

      const tenantTextElement = document.getElementById('tenantText');
      if (tenantTextElement) {
        tenantTextElement.textContent = `Tenant: ${tenant}`;
      }

      // Login form handling
      const loginForm = document.getElementById('loginForm');
      const loginBtn = document.getElementById('loginBtn');
      const loadingSpinner = document.getElementById('loadingSpinner');
      const usernameError = document.getElementById('usernameError');
      const passwordError = document.getElementById('passwordError');

      if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
          try {
            e.preventDefault();
            e.stopPropagation();
            usernameError.classList.add('hidden');
            passwordError.classList.add('hidden');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            let hasError = false;

            if (!username) {
              usernameError.classList.remove('hidden');
              hasError = true;
            }
            if (!password) {
              passwordError.classList.remove('hidden');
              hasError = true;
            }
            if (hasError) return;

            loginBtn.classList.add('hidden');
            loadingSpinner.classList.remove('hidden');

            console.log('🔐 [LOGIN DEBUG] Starting login attempt for user:', username);

            try {
              console.log('🌐 [LOGIN DEBUG] Sending fetch request to /api/auth/login');
              const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
              });

              console.log('📡 [LOGIN DEBUG] Response received - Status:', response.status, response.statusText);
              console.log('📡 [LOGIN DEBUG] Response headers:', Object.fromEntries(response.headers.entries()));

              if (!response.ok) {
                console.error('❌ [LOGIN DEBUG] Response not OK - throwing error');
                throw new Error(`Server error: ${response.status} ${response.statusText}`);
              }

              console.log('✅ [LOGIN DEBUG] Response OK, parsing JSON...');
              const data = await response.json();
              console.log('📦 [LOGIN DEBUG] Parsed response data:', data);

              if (data.success) {
                console.log('✅ [LOGIN DEBUG] Login successful, token received');

                // Store complete user data at once
                const userData = {
                  id: data.user.id,
                  username: data.user.username,
                  role: data.user.role,
                  tenant_id: data.user.tenant_id,
                  guru_id: data.user.guru_id,
                  is_profile_complete: data.user.is_profile_complete,
                  is_default_password: data.user.is_default_password
                };

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(userData));

                console.log('💾 [LOGIN DEBUG] Stored token and user data:', { token: !!data.token, user: userData });

                // Check profile completion and redirect
                if (data.redirect === 'complete-profile.html' && data.teacherId) {
                  Swal.fire({
                    title: 'Profil Belum Lengkap!',
                    text: 'Silakan lengkapi profil Anda untuk melanjutkan.',
                    icon: 'info',
                    confirmButtonText: 'Lengkapi Profil',
                    confirmButtonColor: '#066e3a'
                  }).then((result) => {
                    if (result.isConfirmed) {
                      window.location.href = `complete-profile.html?teacher_id=${data.teacherId}`;
                    }
                  });
                } else {
                  Swal.fire({
                    title: 'Login Berhasil!',
                    text: data.message,
                    icon: 'success',
                    timer: 1500,
                    showConfirmButton: false
                  }).then(() => {
                    console.log('🔄 [LOGIN DEBUG] Redirecting to:', data.redirect);
                    window.location.href = data.redirect;
                  });
                }
              } else {
                console.warn('⚠️ [LOGIN DEBUG] Login failed with message:', data.message);
                Swal.fire({
                  title: 'Login Gagal',
                  text: data.message || 'Terjadi kesalahan. Silakan coba lagi.',
                  icon: data.message && data.message.includes('Password') ? 'warning' : 'error',
                  confirmButtonText: 'Coba Lagi',
                  confirmButtonColor: '#667eea'
                });
              }
            } catch (jsError) {
              console.error('❌ [LOGIN DEBUG] JavaScript error in form submission:', jsError);
              console.error('❌ [LOGIN DEBUG] Error stack:', jsError.stack);
              e.preventDefault();
              e.stopPropagation();
              Swal.fire({
                title: 'Kesalahan Sistem',
                text: 'Terjadi kesalahan dalam memproses form. Silakan coba lagi.',
                icon: 'error',
                confirmButtonText: 'OK',
                confirmButtonColor: '#667eea'
              });
              return;
            }
          } catch (error) {
            console.error('🚫 [LOGIN DEBUG] Network/Fetch error:', error);
            console.error('🚫 [LOGIN DEBUG] Error message:', error.message);
            Swal.fire({
              title: 'Kesalahan Jaringan',
              text: 'Tidak dapat terhubung ke server. Periksa koneksi Anda.',
              icon: 'error',
              confirmButtonText: 'OK',
              confirmButtonColor: '#667eea'
            });
          } finally {
            loginBtn.classList.remove('hidden');
            loadingSpinner.classList.add('hidden');
          }
        });
      }

      // Check for email parameter and auto-fill
      const urlParams = new URLSearchParams(window.location.search);
      const email = urlParams.get('email');
      if (email) {
        document.getElementById('username').value = email;
      }

      // Input validation reset
      const inputs = document.querySelectorAll('input[required]');
      inputs.forEach(input => {
        input.addEventListener('input', () => {
          const errorEl = document.getElementById(input.id + 'Error');
          if (errorEl) errorEl.classList.add('hidden');
        });
      });
    });
  </script>
</body>
</html>
