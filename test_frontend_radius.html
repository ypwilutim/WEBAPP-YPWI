<!DOCTYPE html>
<html>
<head>
    <title>Test Frontend Radius Validation</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>Test Frontend Radius Validation</h1>

    <div id="locationStatus" class="status warning">Initializing...</div>

    <div>
        <button id="checkInBtn" onclick="alert('Check In clicked')" disabled>Absen Masuk</button>
        <button id="checkOutBtn" onclick="alert('Check Out clicked')" disabled>Absen Pulang</button>
    </div>

    <div>
        <h3>Test Locations:</h3>
        <button onclick="testLocation(-2.64552, 121.127793)">Within Radius (School Location)</button>
        <button onclick="testLocation(-2.64702, 121.127793)">Outside Radius (300m away)</button>
        <button onclick="testLocation(-2.69052, 121.127793)">Far Away (5km)</button>
    </div>

    <script>
        // Mock current user and token for testing
        window.user = { guru_id: 95 };
        window.token = 'test-token';

        // Mock currentLocation
        let currentLocation = null;

        // Mock functions from dashboard
        function updateLocationDisplay(success, message) {
            const statusDiv = document.getElementById('locationStatus');
            statusDiv.className = `status ${success ? 'success' : 'error'}`;
            statusDiv.textContent = message;
        }

        function updateAttendanceButtonsState() {
            const checkInBtn = document.getElementById('checkInBtn');
            const checkOutBtn = document.getElementById('checkOutBtn');
            const locationInfo = document.getElementById('locationStatus');

            if (!currentLocation) {
                checkInBtn.disabled = true;
                checkOutBtn.disabled = true;
                locationInfo.className = 'status error';
                locationInfo.textContent = '❌ Lokasi tidak tersedia. Aktifkan GPS untuk absensi.';
                return;
            }

            // Mock validation - simulate API call
            validateLocationRadius(currentLocation.latitude, currentLocation.longitude)
                .then(result => {
                    if (result.withinRadius) {
                        checkInBtn.disabled = false;
                        checkOutBtn.disabled = false;
                        locationInfo.className = 'status success';
                        locationInfo.textContent = `✅ Lokasi valid - Dalam radius ${result.radius}m dari ${result.schoolName}`;
                    } else {
                        checkInBtn.disabled = true;
                        checkOutBtn.disabled = true;
                        locationInfo.className = 'status error';
                        locationInfo.textContent = `❌ Di luar radius! Jarak ${result.distance.toFixed(0)}m dari ${result.schoolName} (max ${result.radius}m)`;
                    }
                })
                .catch(error => {
                    console.error('Radius validation error:', error);
                    checkInBtn.disabled = false;
                    checkOutBtn.disabled = false;
                    locationInfo.className = 'status warning';
                    locationInfo.textContent = '⚠️ Gagal memvalidasi lokasi. Absensi tetap diizinkan.';
                });
        }

        async function validateLocationRadius(userLat, userLng) {
            // Mock API response for testing
            const mockResponse = {
                success: true,
                nearestUnit: {
                    tenant_id: 'SDIT',
                    nama_sekolah: 'SDIT WAHDAH ISLAMIYAH',
                    distance: 0.5
                },
                units: [{
                    tenant_id: 'SDIT',
                    nama_sekolah: 'SDIT WAHDAH ISLAMIYAH',
                    latitude: '-2.64552000',
                    longitude: '119.65210000',
                    location_radius: 200
                }]
            };

            const nearestUnit = mockResponse.nearestUnit;
            const schoolData = mockResponse.units.find(u => u.tenant_id === nearestUnit.tenant_id);

            if (!schoolData || !schoolData.latitude || !schoolData.longitude) {
                return {
                    withinRadius: true,
                    distance: nearestUnit.distance * 1000,
                    radius: 100,
                    schoolName: nearestUnit.nama_sekolah
                };
            }

            const distance = calculateDistance(userLat, userLng,
                parseFloat(schoolData.latitude), parseFloat(schoolData.longitude));

            return {
                withinRadius: (distance * 1000) <= schoolData.location_radius,
                distance: distance * 1000,
                radius: schoolData.location_radius,
                schoolName: nearestUnit.nama_sekolah
            };
        }

        function calculateDistance(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a =
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng/2) * Math.sin(dLng/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const distance = R * c;
            return distance;
        }

        // Test functions
        function testLocation(lat, lng) {
            currentLocation = { latitude: lat, longitude: lng, accuracy: 10 };
            console.log(`Testing location: ${lat}, ${lng}`);
            updateAttendanceButtonsState();
        }

        // Initialize
        updateAttendanceButtonsState();
    </script>
</body>
</html>
