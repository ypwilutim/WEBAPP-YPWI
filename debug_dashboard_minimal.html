<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Dashboard Minimal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-4xl mx-auto p-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-8">Debug Dashboard - Minimal Test</h1>

        <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Testing Area</h2>

            <!-- Test content around line 491 -->
            <div class="bg-gray-50 rounded-lg p-4 mb-6">
                <div class="flex items-start space-x-3">
                    <i class="fas fa-info-circle text-blue-500 mt-0.5"></i>
                    <div>
                        <h5 class="font-medium text-gray-900">Informasi Aturan</h5>
                        <p class="text-sm text-gray-600 mt-1">
                            Aturan absensi berlaku berdasarkan prioritas: Aturan sekolah spesifik → Aturan default sistem.
                            Pastikan tidak ada konflik jadwal antar aturan.
                        </p>
                    </div>
                </div>
            </div>

            <div id="test-output" class="p-4 bg-gray-100 rounded">
                Loading test results...
            </div>
        </div>
    </div>

    <script type="module">
        console.log('Debug dashboard minimal loaded');

        const output = document.getElementById('test-output');
        output.innerHTML = '<p>✅ Script loaded successfully</p>';

        // Test async/await functionality
        async function testAsync() {
            try {
                output.innerHTML += '<p>🧪 Testing async/await...</p>';
                await new Promise(resolve => setTimeout(resolve, 100));
                output.innerHTML += '<p>✅ Async/await works perfectly</p>';
                console.log('Async test completed successfully');
            } catch (error) {
                output.innerHTML += `<p>❌ Async error: ${error.message}</p>`;
                console.error('Async test failed:', error);
            }
        }

        // Test fetch functionality
        async function testFetch() {
            try {
                output.innerHTML += '<p>🌐 Testing fetch...</p>';
                const response = await fetch('/api/search/teachers?limit=1');
                if (response.ok) {
                    const data = await response.json();
                    output.innerHTML += `<p>✅ Fetch works - Found ${data.data.length} teachers</p>`;
                } else {
                    output.innerHTML += `<p>⚠️ Fetch returned status ${response.status}</p>`;
                }
            } catch (error) {
                output.innerHTML += `<p>❌ Fetch error: ${error.message}</p>`;
            }
        }

        // Run tests
        setTimeout(() => {
            testAsync();
            testFetch();
        }, 500);

        // Check for any JavaScript errors
        window.addEventListener('error', function(e) {
            output.innerHTML += `<p style="color: red;">🚨 JavaScript Error: ${e.message} at line ${e.lineno}</p>`;
            console.error('JavaScript error caught:', e);
        });

        output.innerHTML += '<p>🎯 Test initialized - check console for details</p>';
    </script>
</body>
</html>
